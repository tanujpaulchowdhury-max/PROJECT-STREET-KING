name: Build Android APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
inspect:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Inspect game code
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      mkdir -p project
      ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
      test -n "$ZIP_FILE"
      unzip -oq "$ZIP_FILE" -d project
      PROJECT_FILE="$(find project -name project.godot -print -quit)"
      test -n "$PROJECT_FILE"
      PROJECT_DIR="$(dirname "$PROJECT_FILE")"
      echo "=== MAIN SCRIPT LINES 80-135 ==="
      nl -ba "$PROJECT_DIR/scripts/main.gd" | sed -n '80,135p'
      echo "=== ANDROID EXPORT SETTINGS ==="
      if [ -f "$PROJECT_DIR/export_presets.cfg" ]; then
        cat "$PROJECT_DIR/export_presets.cfg"
      else
        echo "No export_presets.cfg found"
      fi1m 3s
