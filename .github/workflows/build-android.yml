
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository root"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          PROJECT_DIR=$(find project -name project.godot -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "project.godot not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        uses: barichello/godot-ci@v4.4.1
        with:
          godot_version: 4.4.1
          export_type: debug
          export_path: build/PROJECT_STREET_KING.apk
          project_path: ${{ env.PROJECT_DIR }}

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-STREET-KING-APK
          path: build/PROJECT_STREET_KING.apk
