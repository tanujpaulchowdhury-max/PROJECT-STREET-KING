
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE" || { echo "Project ZIP not found"; exit 1; }
          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project
          PROJECT_FILE="$(find project -name project.godot -print -quit)"
          test -n "$PROJECT_FILE" || { echo "project.godot not found"; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: |
          docker pull barichello/godot-ci:4.5.1
          docker run --rm -v "$PWD:/work" -w /work barichello/godot-ci:4.5.1 \
            godot --headless --path "/work/$PROJECT_DIR" --editor --quit

      - name: Fix Android export preset
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "export_presets.cfg"
          if not p.exists():
              raise SystemExit("Missing export_presets.cfg")
          text = p.read_text()
          chunks = re.split(r'(?=^\[preset\.\d+\]$)', text, flags=re.M)
          for i, chunk in enumerate(chunks):
              if re.search(r'^name="Android"$', chunk, re.M):
                  key = r'^gradle_build/use_gradle_build=.*$'
                  if re.search(key, chunk, re.M):
                      chunk = re.sub(key, 'gradle_build/use_gradle_build=true', chunk, count=1, flags=re.M)
                  else:
                      chunk = re.sub(r'(^\[preset\.\d+\.options\]\n)', r'\1gradle_build/use_gradle_build=true\n', chunk, count=1, flags=re.M)
                  chunks[i] = chunk
                  break
          else:
              raise SystemExit("Android export preset not found")
          p.write_text("".join(chunks))
          print("Android Gradle export enabled")
          PY

      - name: Export Android APK
        run: |
          mkdir -p build
          docker run --rm -v "$PWD:/work" -w /work barichello/godot-ci:4.5.1 \
            godot --headless --path "/work/$PROJECT_DIR" \
            --export-debug "Android" /work/build/PROJECT_STREET_KING.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-STREET-KING-APK
          path: build/PROJECT_STREET_KING.apk
          if-no-files-found: error
          retention-days: 14
