name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract Godot project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE" || { echo "Project ZIP not found"; exit 1; }

          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          PROJECT_FILE="$(find project -name project.godot -print -quit)"
          test -n "$PROJECT_FILE" || { echo "project.godot not found"; exit 1; }

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download Godot export templates
        run: |
          curl -fL \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz \
            -o templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -oq templates.tpz -d /tmp/godot-templates
          mkdir -p godot_templates/4.5.1.stable
          cp -a /tmp/godot-templates/templates/. godot_templates/4.5.1.stable/

      - name: Configure Android preset
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "export_presets.cfg"
          if not p.exists():
              raise SystemExit("export_presets.cfg is missing")

          sections = re.split(r'(?m)(?=^\[)', p.read_text())
          found = False

          for i, section in enumerate(sections):
              header = section.splitlines()[0] if section.splitlines() else ""
              match = re.fullmatch(r'\[preset\.(\d+)\]', header.strip())

              if match and re.search(r'(?m)^name="Android"\s*$', section):
                  number = match.group(1)
                  options_header = f"[preset.{number}.options]"

                  for j, options in enumerate(sections):
                      first = options.splitlines()[0] if options.splitlines() else ""

                      if first.strip() == options_header:
                          if re.search(r'(?m)^gradle_build/use_gradle_build=', options):
                              sections[j] = re.sub(
                                  r'(?m)^gradle_build/use_gradle_build=.*$',
                                  'gradle_build/use_gradle_build=false',
                                  options
                              )
                          else:
                              sections[j] = options.rstrip() + \
                                  '\ngradle_build/use_gradle_build=false\n'
                          break
                  else:
                      sections.append(
                          '\n' + options_header +
                          '\ngradle_build/use_gradle_build=false\n'
                      )

                  found = True
                  break

          if not found:
              raise SystemExit("Android export preset not found")

          p.write_text(''.join(sections))
          print("Android preset configured.")
          PY

      - name: Import project and export APK
        run: |
          docker pull barichello/godot-ci:4.5.1
          mkdir -p build

          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/godot_templates:/root/.local/share/godot/export_templates" \
            -w /work \
            -e PROJECT_DIR="$PROJECT_DIR" \
            barichello/godot-ci:4.5.1 \
            bash -lc '
              set -e

              SDKMANAGER="$(find /usr/lib /opt /usr/local /root -type f -name sdkmanager 2>/dev/null | head -n 1)"

              if [ -z "$SDKMANAGER" ]; then
                echo "ERROR: sdkmanager was not found in the Docker image."
                exit 1
              fi

              SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

              if [ -z "$SDK_ROOT" ]; then
                SDK_ROOT="${SDKMANAGER%%/cmdline-tools/*}"
                SDK_ROOT="${SDK_ROOT%%/tools/*}"
              fi

              echo "Android SDK: $SDK_ROOT"

              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

              "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
                "platform-tools" \
                "platforms;android-33" \
                "build-tools;33.0.2"

              godot --headless --editor \
                --path "/work/$PROJECT_DIR" --quit

              godot --headless \
                --path "/work/$PROJECT_DIR" \
                --export-debug "Android" \
                /work/build/PROJECT_STREET_KING.apk
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-STREET-KING-APK
          path: build/PROJECT_STREET_KING.apk
          if-no-files-found: error
          retention-days: 14
