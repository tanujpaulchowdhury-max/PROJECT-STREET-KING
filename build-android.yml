name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Build APK with Godot Android export image
        run: |
          mkdir -p build
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            godot --headless --path /project --editor --quit
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            godot --headless --path /project --export-debug "Android" /project/build/PROJECT_STREET_KING.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_STREET_KING-Android-APK
          path: build/PROJECT_STREET_KING.apk
          if-no-files-found: error
          retention-days: 14
